name: sniffnet
base: core26
version: '1.5.1'
title: Sniffnet
icon: snap/gui/sniffnet.png
summary: Monitor network traffic and analyze packet capture files
description: |
  Sniffnet visualizes network traffic, connections, services and hosts.
  Capture live traffic or analyze saved packet captures, filter traffic,
  export reports and set notifications with a native desktop interface.

  Saved-capture analysis works out of the box. Live capture needs the
  network-control and network-observe interfaces connected and Sniffnet run
  as root; see the project page for the steps. Host process attribution is
  unavailable under strict confinement.
license: MIT OR Apache-2.0
grade: stable
confinement: strict
website: https://sniffnet.app
source-code:
  - https://github.com/GyulyVGC/sniffnet
  - https://github.com/sidalit/sniffnet-snap
issues:
  - https://github.com/GyulyVGC/sniffnet/issues
  - https://github.com/sidalit/sniffnet-snap/issues
contact: https://github.com/sidalit/sniffnet-snap/issues

platforms:
  amd64:
  arm64:

apps:
  sniffnet:
    command: bin/sniffnet
    extensions: [gnome]
    plugs:
      - audio-playback
      - home
      - network
      - network-control
      - network-observe
      - removable-media

parts:
  # libpcap fails the whole device scan when strict confinement denies its
  # Bluetooth or netfilter probes, so build it without those backends.
  libpcap:
    plugin: nil
    source: https://github.com/the-tcpdump-group/libpcap.git
    source-tag: libpcap-1.10.7
    source-depth: 1
    build-packages:
      - autoconf
      - automake
      - bison
      - build-essential
      - flex
    override-build: |
      ./autogen.sh
      ./configure \
        --prefix=/usr \
        --libdir="/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR" \
        --disable-bluetooth \
        --disable-dbus \
        --disable-rdma \
        --without-libnl \
        ac_cv_netfilter_can_compile=no
      make -j"$CRAFT_PARALLEL_BUILD_COUNT"
      make install DESTDIR="$CRAFT_PART_INSTALL"
      install -Dm644 LICENSE -t "$CRAFT_PART_INSTALL/usr/share/doc/libpcap"
    prime:
      - usr/lib/*/libpcap.so.*
      - usr/share/doc/libpcap

  sniffnet:
    after: [libpcap]
    plugin: rust
    source: https://github.com/GyulyVGC/sniffnet.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    source-depth: 1
    rust-channel: stable
    build-packages:
      - build-essential
      - libasound2-dev
      - libfontconfig-dev
      - pkg-config
    build-environment:
      - LIBPCAP_LIBDIR: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      - LIBPCAP_VER: 1.10.7
    stage-packages:
      - libxkbcommon-x11-0
    override-build: |
      craftctl default
      install -Dm644 LICENSE-MIT LICENSE-APACHE \
        -t "$CRAFT_PART_INSTALL/usr/share/doc/sniffnet"
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/gui/sniffnet.png" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/sniffnet.png"
